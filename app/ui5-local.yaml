# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: z2fiori
type: application
resources:
  configuration:
    paths:
      webapp: app/webapp
framework:
  name: SAPUI5
  version: 1.151.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: http://localhost:3000 # abap2fiori backend (npm run start in repo root)
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: app/webapp
        delay: 300
