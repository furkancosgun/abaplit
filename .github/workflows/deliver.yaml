name: Deliver Distribution Branches

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Distributions
        run: npm run build:dist

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

      - name: Deploy Standard (On-Premise) Branch
        run: |
          TREE_ID=$(git write-tree --prefix=build/standard)
          COMMIT_ID=$(git commit-tree $TREE_ID -p HEAD -m "deploy(standard): build for $(git rev-parse --short HEAD)")
          git update-ref refs/heads/standard $COMMIT_ID
          git push origin standard --force

      - name: Deploy Cloud Branch
        run: |
          TREE_ID=$(git write-tree --prefix=build/cloud)
          COMMIT_ID=$(git commit-tree $TREE_ID -p HEAD -m "deploy(cloud): build for $(git rev-parse --short HEAD)")
          git update-ref refs/heads/cloud $COMMIT_ID
          git push origin cloud --force
